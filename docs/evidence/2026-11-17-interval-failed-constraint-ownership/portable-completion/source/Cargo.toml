[package]
name = "residual-certainty-consumer"
version = "0.0.0"
edition = "2024"
[workspace]
[[bin]]
name = "residual-certainty-consumer"
path = "main.rs"
[features]
trace = ["hyperreal/dispatch-trace", "hypersolve/dispatch-trace"]
[dependencies]
hypersolve = { path = "/mnt/development/interval-residual-certainty/csgrs/crates/hypersolve", default-features = false }
hyperreal = { path = "/mnt/development/interval-residual-certainty/csgrs/crates/hyperreal", default-features = false }
hyperlimit = { path = "/mnt/development/interval-residual-certainty/csgrs/crates/hyperlimit", default-features = false }

[lib]
path = "lib.rs"
crate-type = ["rlib", "cdylib"]
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
