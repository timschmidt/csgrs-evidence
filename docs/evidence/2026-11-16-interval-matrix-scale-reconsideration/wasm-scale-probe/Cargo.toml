[package]
name = "matrix-scale-wasm"
version = "0.0.0"
edition = "2024"
[workspace]
[features]
shared = []
[lib]
path = "lib.rs"
crate-type = ["cdylib"]
[dependencies]
hyperlattice-interval = { path = "/mnt/development/interval-profile-static/csgrs/crates/hyperlattice-interval", default-features = false, features = ["fixed"] }
[profile.release]
panic = "abort"
overflow-checks = true
