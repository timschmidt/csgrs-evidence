[package]
name = "jacobian-context-resource-probe"
version = "0.0.0"
edition = "2024"
[workspace]
[[bin]]
name = "jacobian-context-resource-probe"
path = "main.rs"
[features]
trace = ["hypersolve/dispatch-trace", "hyperreal/dispatch-trace"]
[dependencies]
hypersolve = { path = "/mnt/development/interval-jacobian-context/csgrs/crates/hypersolve", default-features = false }
hyperreal = { path = "/mnt/development/interval-jacobian-context/csgrs/crates/hyperreal", default-features = false }
