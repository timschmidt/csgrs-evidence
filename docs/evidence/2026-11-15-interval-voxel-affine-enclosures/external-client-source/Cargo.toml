[package]
name="affine-voxel-client"
version="0.0.0"
edition="2024"
rust-version="1.95"
[workspace]
[dependencies]
hypersdf={path="/mnt/development/csgrs-voxel-affine-enclosures/crates/hypersdf",features=["enclosure-program","hypervoxel-adapter"]}
hyperinterval={path="/mnt/development/csgrs-voxel-affine-enclosures/crates/hyperinterval",default-features=false,features=["hyperreal"]}
hyperreal={path="/mnt/development/csgrs-voxel-affine-enclosures/crates/hyperreal"}
hypersolve={path="/mnt/development/csgrs-voxel-affine-enclosures/crates/hypersolve",default-features=false,features=["taylor-model"]}
hypervoxel={path="/mnt/development/csgrs-voxel-affine-enclosures/crates/hypervoxel",features=["interval-enclosure"]}
