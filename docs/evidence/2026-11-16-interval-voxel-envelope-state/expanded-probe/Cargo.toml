[package]
name = "voxel-envelope-resources"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
hypervoxel = { path = "/mnt/development/interval-voxel-envelope-state/csgrs/crates/hypervoxel", default-features = false }
hyperreal = { path = "/mnt/development/interval-voxel-envelope-state/csgrs/crates/hyperreal" }
[features]
trace = ["hypervoxel/dispatch-trace", "hyperreal/dispatch-trace"]
allocation = []
[[bin]]
name = "voxel-envelope-resources"
