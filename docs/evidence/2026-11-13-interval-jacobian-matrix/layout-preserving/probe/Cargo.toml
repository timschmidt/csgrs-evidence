[package]
name = "jacobian-matrix-probe"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
hypersolve = { path = "/mnt/development/csgrs-jacobian-matrix-layout/crates/hypersolve", features = ["interval-lattice"] }
hyperlattice = { path = "/mnt/development/csgrs-jacobian-matrix-layout/crates/hyperlattice", features = ["interval-dyadic"] }
hyperinterval = { path = "/mnt/development/csgrs-jacobian-matrix-layout/crates/hyperinterval", features = ["dyadic"] }
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
overflow-checks = true
strip = "symbols"
[[bin]]
name = "manual"
path = "src/manual.rs"
[[bin]]
name = "shared"
path = "src/shared.rs"
