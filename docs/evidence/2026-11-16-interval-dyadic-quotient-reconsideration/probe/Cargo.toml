[package]
name = "dyadic-quotient-current-probe"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
hyperinterval = { path = "/mnt/development/interval-dyadic-quotient-current/csgrs/crates/hyperinterval", features = ["hyperreal", "serde"] }
hyperreal = { path = "/mnt/development/interval-dyadic-quotient-current/csgrs/crates/hyperreal" }
num-bigint = "0.4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[features]
trace = ["hyperinterval/dispatch-trace", "hyperreal/dispatch-trace"]
allocation = []
[[bin]]
name = "dyadic-quotient-current-probe"
path = "main.rs"
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
