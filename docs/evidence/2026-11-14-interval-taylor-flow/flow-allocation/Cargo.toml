[package]
name = "flow-allocation"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
hyperdynamics = { path = "/mnt/development/csgrs-taylor-flow/crates/hyperdynamics", features = ["taylor-flow"] }
hyperinterval = { default-features = false, path = "/mnt/development/csgrs-taylor-flow/crates/hyperinterval", features = ["hyperreal"] }
hyperlattice-interval = { default-features = false, path = "/mnt/development/csgrs-taylor-flow/crates/hyperlattice-interval", features = ["dyadic"] }
hyperreal = { path = "/mnt/development/csgrs-taylor-flow/crates/hyperreal" }
hypersolve = { default-features = false, path = "/mnt/development/csgrs-taylor-flow/crates/hypersolve" }
