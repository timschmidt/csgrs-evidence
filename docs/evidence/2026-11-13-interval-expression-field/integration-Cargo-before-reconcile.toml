[package]
name = "hyperdynamics"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
description = "Exact dynamics and independently replayed motion limits for the Hyper stack"
license = "MIT OR Apache-2.0"
repository = "https://github.com/timschmidt/csgrs"
readme = "README.md"
include = ["/src/**", "/examples/**", "/README.md", "/CHANGELOG.md", "/LICENSE*"]
categories = ["mathematics", "science"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
field = ["dep:hyperinterval", "dep:hyperlattice-interval", "hypersolve/interval-program"]
serde = ["dep:serde", "hypersolve/serde", "hyperlattice-interval?/serde"]
dispatch-trace = ["hyperlimit/dispatch-trace", "hyperreal/dispatch-trace", "hypersolve/dispatch-trace"]

[dependencies]
hyperlimit = { version = "0.5.0", path = "../hyperlimit", default-features = false }
hyperreal = { version = "0.14.0", path = "../hyperreal", default-features = false }
hypersolve = { version = "0.4.0", path = "../hypersolve", default-features = false }

hyperinterval = { version = "0.1.0", path = "../hyperinterval", default-features = false, features = ["hyperreal"], optional = true }
hyperlattice-interval = { version = "0.1.0", path = "../hyperlattice-interval", default-features = false, features = ["dyadic"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0"

[[example]]
name = "expression_field"
required-features = ["field"]
