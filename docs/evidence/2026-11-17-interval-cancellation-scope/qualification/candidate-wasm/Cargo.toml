[package]
name = "cancellation-boundary-witness"
version = "0.0.0"
edition = "2024"
[workspace]
[[bin]]
name = "cancellation-boundary-witness"
path = "main.rs"
[dependencies]
hypersolve = { version = "=0.4.0", default-features = false }
[patch.crates-io]
hyperreal = { path = "/dev/shm/interval-cancellation-scope/csgrs/crates/hyperreal" }
hyperlattice = { path = "/dev/shm/interval-cancellation-scope/csgrs/crates/hyperlattice" }
hyperlimit = { path = "/dev/shm/interval-cancellation-scope/csgrs/crates/hyperlimit" }
hypersolve = { path = "/dev/shm/interval-cancellation-scope/csgrs/crates/hypersolve" }
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lib]
path = "lib.rs"
crate-type = ["cdylib"]
