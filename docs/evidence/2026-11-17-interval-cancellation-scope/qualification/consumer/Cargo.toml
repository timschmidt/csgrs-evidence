[package]
name = "solver-cancellation-consumer"
version = "0.0.0"
edition = "2024"
[workspace]
[[bin]]
name = "cancellation-resource"
path = "main.rs"
[[bin]]
name = "cancellation-lifetime"
path = "lifetime.rs"
[[bin]]
name = "cancellation-reused"
path = "reused.rs"
[features]
default = ["added"]
added = []
trace = ["hyperreal/dispatch-trace", "hypersolve/dispatch-trace"]
cancel-retry = []
[dependencies]
hypersolve = { path = "/dev/shm/interval-cancellation-scope/csgrs/crates/hypersolve", default-features = false }
hyperreal = { path = "/dev/shm/interval-cancellation-scope/csgrs/crates/hyperreal", default-features = false }
hyperlimit = { path = "/dev/shm/interval-cancellation-scope/csgrs/crates/hyperlimit", default-features = false }
