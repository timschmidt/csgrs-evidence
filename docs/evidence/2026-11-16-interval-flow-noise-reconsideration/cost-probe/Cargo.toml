[package]
name = "flow-noise-cost-probe"
version = "0.0.0"
edition = "2024"
[workspace]
[[bin]]
name = "flow-noise-cost-probe"
path = "main.rs"
[features]
default = []
noise = ["hyperdynamics/flow-noise"]
allocation = []
[dependencies]
hyperdynamics = { path = "/mnt/development/interval-profile-static/csgrs/crates/hyperdynamics", default-features = false, features = ["taylor-flow"] }
hypersolve = { path = "/mnt/development/interval-profile-static/csgrs/crates/hypersolve", default-features = false }
hyperinterval = { path = "/mnt/development/interval-profile-static/csgrs/crates/hyperinterval", default-features = false, features = ["hyperreal"] }
hyperlattice-interval = { path = "/mnt/development/interval-profile-static/csgrs/crates/hyperlattice-interval", default-features = false, features = ["dyadic"] }
