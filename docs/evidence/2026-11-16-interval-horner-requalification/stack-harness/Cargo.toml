[package]
name = "horner-stack-harness"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
hypersolve = { path = "/mnt/development/interval-horner-stack/csgrs/crates/hypersolve", default-features = false }
hyperlimit = { path = "/mnt/development/interval-horner-stack/csgrs/crates/hyperlimit", default-features = false }
hyperreal = { path = "/mnt/development/interval-horner-stack/csgrs/crates/hyperreal", default-features = false, features = ["serde"] }
hyperinterval = { path = "/mnt/development/interval-horner-stack/csgrs/crates/hyperinterval", default-features = false, features = ["rational"] }
[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
