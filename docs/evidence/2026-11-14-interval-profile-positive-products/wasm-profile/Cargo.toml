[package]
name = "machine-profile-wasm"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
alumina-interface-core = { path = "/mnt/development/interval-profile-positive/alumina-interface/crates/alumina-interface-core" }
alumina-board = { path = "/mnt/development/interval-profile-positive/alumina-firmware/crates/alumina-board" }
alumina-config = { path = "/mnt/development/interval-profile-positive/alumina-firmware/crates/alumina-config" }
alumina-protocol = { path = "/mnt/development/interval-profile-positive/alumina-firmware/crates/alumina-protocol" }
alumina-storage = { path = "/mnt/development/interval-profile-positive/alumina-firmware/crates/alumina-storage" }
board-mks-tinybee = { path = "/mnt/development/interval-profile-positive/alumina-firmware/boards/mks-tinybee" }
[profile.release]
codegen-units = 1
debug-assertions = false
incremental = false
lto = "fat"
opt-level = "z"
overflow-checks = true
panic = "abort"
strip = "symbols"

[lib]
crate-type = ["cdylib"]
