[package]
name="surface-interval-range-cost-probe"
version="0.0.0"
edition="2024"
[workspace]
[[bin]]
name="surface-interval-range-cost-probe"
path="main.rs"
[dependencies]
hyperbrep={path="/mnt/development/csgrs-surface-interval-ranges/crates/hyperbrep",features=["interval-ranges"]}
hypersolve={path="/mnt/development/csgrs-surface-interval-ranges/crates/hypersolve"}
hyperinterval={path="/mnt/development/csgrs-surface-interval-ranges/crates/hyperinterval",default-features=false,features=["hyperreal"]}
hyperlattice={path="/mnt/development/csgrs-surface-interval-ranges/crates/hyperlattice"}
hyperlimit={path="/mnt/development/csgrs-surface-interval-ranges/crates/hyperlimit"}
hyperreal={path="/mnt/development/csgrs-surface-interval-ranges/crates/hyperreal",default-features=false}
