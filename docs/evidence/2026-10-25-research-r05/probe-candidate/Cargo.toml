[package]
name = "research_cut_probe"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "research_cut_probe"
path = "main.rs"

[dependencies]
hypercurve = { path = "/home/tim/Documents/GitHub/workspace/csgrs/crates/hypercurve", default-features = false }
hyperreal = { path = "/home/tim/Documents/GitHub/workspace/csgrs/crates/hyperreal", default-features = false, features = ["serde"] }
hyperlimit = { path = "/home/tim/Documents/GitHub/workspace/csgrs/crates/hyperlimit", default-features = false, features = ["std"] }
hypersolve = { path = "/home/tim/Documents/GitHub/workspace/csgrs/crates/hypersolve", default-features = false }
serde_json = "=1.0.149"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
