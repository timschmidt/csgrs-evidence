[package]
name = "r19-whole-workflow-cost"
version = "0.0.0"
edition = "2024"

[workspace]

[features]
default = ["curve", "stl-io", "obj-io"]
curve = ["csgrs/curve"]
stl-io = ["csgrs/stl-io"]
obj-io = ["csgrs/obj-io"]

[[test]]
name = "native_workflow_cost"
path = "main.rs"

[dependencies]
csgrs = { path = "/tmp/csgrs-r19-trace", default-features = false }
hyperreal = { path = "/tmp/csgrs-r19-trace/crates/hyperreal", features = ["serde", "cached-f64-approx"] }
hyperlattice = { path = "/tmp/csgrs-r19-trace/crates/hyperlattice" }
hyperlimit = { path = "/tmp/csgrs-r19-trace/crates/hyperlimit" }
hypermesh = { path = "/tmp/csgrs-r19-trace/crates/hypermesh" }
hypercurve = { path = "/tmp/csgrs-r19-trace/crates/hypercurve" }
serde_json = "1.0.149"
