[package]
name = "r19_brep_archive_probe"
version = "0.0.0"
edition = "2024"
[workspace]
[[bin]]
name = "r19_brep_archive_probe"
path = "main.rs"
[dependencies]
hyperbrep = { path = "/tmp/csgrs-r19-trace/crates/hyperbrep" }
hyperlimit = { path = "/tmp/csgrs-r19-trace/crates/hyperlimit", features = ["serde"] }
hyperreal = { path = "/tmp/csgrs-r19-trace/crates/hyperreal", features = ["serde", "cached-f64-approx"] }
num-bigint = "=0.4.6"
serde_json = "=1.0.149"
[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
