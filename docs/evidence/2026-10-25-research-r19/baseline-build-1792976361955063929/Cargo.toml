[package]
name = "r19_cold_import_probe"
version = "0.0.0"
edition = "2024"

[workspace]

[dependencies]
hyperreal = { path = "/tmp/csgrs-r19-trace/crates/hyperreal", features = ["serde", "cached-f64-approx"] }
hyperlimit = { path = "/tmp/csgrs-r19-trace/crates/hyperlimit", features = ["serde"] }
num-bigint = "=0.4.6"
serde_json = "1"
ciborium = "0.2"

[[bin]]
name = "r19_cold_import_probe"
path = "main.rs"
