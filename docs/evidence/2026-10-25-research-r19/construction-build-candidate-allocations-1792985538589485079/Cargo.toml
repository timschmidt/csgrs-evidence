[package]
name = "r19_construction_cost"
version = "0.0.0"
edition = "2024"
[workspace]
[[bin]]
name = "r19_construction_cost"
path = "main.rs"
[dependencies]
hyperlimit = { path = "/tmp/csgrs-r19-trace/crates/hyperlimit", features = ["serde"] }
hyperreal = { path = "/tmp/csgrs-r19-trace/crates/hyperreal", features = ["serde", "cached-f64-approx"] }
serde_json = "=1.0.149"
ciborium = "0.2"
[features]
allocations = []
[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
