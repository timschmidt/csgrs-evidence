[package]
name = "servo-migration-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
autobins = false
[workspace]
[dependencies]
alumina-foc = { path = "/mnt/development/alumina-servo-migration/crates/alumina-foc" }
alumina-protocol = { path = "/mnt/development/alumina-servo-migration/crates/alumina-protocol" }
[[bin]]
name = "observe"
path = "src/bin/observe.rs"
[[bin]]
name = "cost"
path = "src/bin/cost.rs"
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
overflow-checks = true
