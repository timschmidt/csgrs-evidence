[package]
name = "solver-five-portable"
version = "0.0.0"
edition = "2024"
[workspace]
[[bin]]
name = "solver-five-portable"
path = "main.rs"
[lib]
path = "lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
trace = ["hyperreal/dispatch-trace", "hypersolve/dispatch-trace"]
added = []
[dependencies]
hypersolve = { path = "/mnt/development/interval-solver-five-repair/csgrs/crates/hypersolve", default-features = false }
hyperreal = { path = "/mnt/development/interval-solver-five-repair/csgrs/crates/hyperreal", default-features = false }
hyperlimit = { path = "/mnt/development/interval-solver-five-repair/csgrs/crates/hyperlimit", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
