[package]
name = "flow-noise-archive-consumer"
version = "0.0.0"
edition = "2024"
[workspace]
[features]
default = ["taylor-flow", "flow-noise", "serde"]
taylor-flow = []
flow-noise = []
serde = []
[dependencies]
hyperreal = { version = "=0.14.0", default-features = false, features = [] }
hyperinterval = { version = "=0.1.0", default-features = false, features = ["hyperreal"] }
hyperlattice-interval = { version = "=0.1.0", default-features = false, features = ["dyadic"] }
hyperlattice = { version = "=0.7.0", default-features = false, features = [] }
hyperlimit = { version = "=0.5.0", default-features = false, features = [] }
hypersolve = { version = "=0.4.0", default-features = false, features = [] }
hyperdynamics = { version = "=0.1.0", default-features = false, features = ["flow-noise", "serde"] }
serde_json = "1.0"
[patch.crates-io]
hyperreal = { path = "/mnt/development/.interval-refactor-build/flow-noise-delivery/packages/hyperreal-0.14.0" }
hyperinterval = { path = "/mnt/development/.interval-refactor-build/flow-noise-delivery/packages/hyperinterval-0.1.0" }
hyperlattice-interval = { path = "/mnt/development/.interval-refactor-build/flow-noise-delivery/packages/hyperlattice-interval-0.1.0" }
hyperlattice = { path = "/mnt/development/.interval-refactor-build/flow-noise-delivery/packages/hyperlattice-0.7.0" }
hyperlimit = { path = "/mnt/development/.interval-refactor-build/flow-noise-delivery/packages/hyperlimit-0.5.0" }
hypersolve = { path = "/mnt/development/.interval-refactor-build/flow-noise-delivery/packages/hypersolve-0.4.0" }
hyperdynamics = { path = "/mnt/development/.interval-refactor-build/flow-noise-delivery/packages/hyperdynamics-0.1.0" }
