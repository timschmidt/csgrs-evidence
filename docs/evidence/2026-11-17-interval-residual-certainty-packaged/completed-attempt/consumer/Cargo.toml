[package]
name = "residual-certainty-consumer"
version = "0.0.0"
edition = "2024"
[workspace]
[[bin]]
name = "residual-certainty-consumer"
path = "main.rs"
[features]
trace = ["hyperreal/dispatch-trace", "hypersolve/dispatch-trace"]
[dependencies]
hypersolve = { version = "=0.4.0", default-features = false }
hyperreal = { version = "=0.14.0", default-features = false }
hyperlimit = { version = "=0.5.0", default-features = false }

[lib]
path = "lib.rs"
crate-type = ["rlib", "cdylib"]
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[patch.crates-io]
hyperreal = { path = "../packages/hyperreal-0.14.0" }
hyperlattice = { path = "../packages/hyperlattice-0.7.0" }
hyperlimit = { path = "../packages/hyperlimit-0.5.0" }
hypersolve = { path = "../packages/hypersolve-0.4.0" }
