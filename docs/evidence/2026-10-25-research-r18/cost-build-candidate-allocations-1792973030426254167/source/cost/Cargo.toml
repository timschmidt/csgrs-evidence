[package]
name = "r18_predicate_cost"
version = "0.1.0"
edition = "2024"
[workspace]
[[bin]]
name = "r18_predicate_cost"
path = "main.rs"
[dependencies]
hyperlimit = { path = "/tmp/csgrs-r18-trace/crates/hyperlimit", features = ["serde"] }
hyperreal = { path = "/tmp/csgrs-r18-trace/crates/hyperreal", features = ["serde", "cached-f64-approx"] }
serde_json = "=1.0.149"
[features]
allocations = []
[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
