[package]
name = "predicate-filter-probe"
version = "0.0.0"
edition = "2024"
[workspace]
[features]
trace = ["hyperlimit/dispatch-trace", "hyperreal/dispatch-trace"]
[dependencies]
hyperlimit = { path = "/mnt/development/csgrs-predicate-filters/crates/hyperlimit" }
hyperreal = { path = "/mnt/development/csgrs-predicate-filters/crates/hyperreal" }
hyperinterval = { path = "/mnt/development/csgrs-predicate-filters/crates/hyperinterval", features = ["hyperreal"] }
