[package]
name="packaged-dyadic-client"
version="0.0.0"
edition="2024"
rust-version="1.88"
[workspace]
[lib]
crate-type=["cdylib","rlib"]
[dependencies]
hyperinterval={version="=0.1.0",default-features=false,features=["dyadic","float-enclosure"]}
num-bigint="=0.4.6"
[profile.release]
panic="abort"
overflow-checks=true
[patch.crates-io]
hyperinterval={path="/mnt/development/.interval-refactor-build/ieee-egress-package/packages/hyperinterval-0.1.0"}
