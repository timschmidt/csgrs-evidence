[package]
name = "packaged-float-wasm-client"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
[workspace]
[lib]
crate-type = ["cdylib"]
[dependencies]
hyperinterval = { version = "=0.1.0", default-features = false, features = ["float-enclosure"] }
[profile.release]
panic = "abort"
overflow-checks = true
[patch.crates-io]
hyperinterval = { path = "/mnt/development/.interval-refactor-build/wasm-float-packaged/packages/hyperinterval-0.1.0" }
