[package]
name = "research_comparison_probe"
version = "0.1.0"
edition = "2024"
[workspace]
[[bin]]
name = "research_comparison_probe"
path = "main.rs"
[dependencies]
hypercurve = { path = "/tmp/csgrs-r15-baseline/crates/hypercurve", default-features = false }
hyperreal = { path = "/tmp/csgrs-r15-baseline/crates/hyperreal", default-features = false, features = ["serde"] }
serde_json = "=1.0.149"
[features]
allocations = []
[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
