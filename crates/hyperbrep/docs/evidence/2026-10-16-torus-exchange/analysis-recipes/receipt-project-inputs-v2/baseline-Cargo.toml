[package]
name = "hyperbrep-torus-receipt-probe"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
hyperbrep = { path = "/tmp/hyperbrep-torus-receipt-v2-baseline/crates/hyperbrep", default-features = false }
hyperbrep-io = { path = "/tmp/hyperbrep-torus-receipt-v2-baseline/crates/hyperbrep-io", default-features = false }
hypercurve = { path = "/tmp/hyperbrep-torus-receipt-v2-baseline/crates/hypercurve", features = ["triangulation"] }
hyperlimit = { path = "/tmp/hyperbrep-torus-receipt-v2-baseline/crates/hyperlimit" }
hyperreal = { path = "/tmp/hyperbrep-torus-receipt-v2-baseline/crates/hyperreal", features = ["serde", "cached-f64-approx"] }
hypertri = { path = "/tmp/hyperbrep-torus-receipt-v2-baseline/crates/hypertri", default-features = false, features = ["earcut", "cdt"] }
serde_json = "=1.0.149"
