[package]
name = "hyperbrep-procedural-revolution-solids"
version = "0.0.0"
edition = "2024"
[workspace]
[[bin]]
name = "hyperbrep-procedural-revolution-solids"
path = "main.rs"
[lib]
name = "hyperbrep_procedural_revolution_solids"
path = "lib.rs"
crate-type = ["cdylib"]
[dependencies]
hyperbrep = { path = "/mnt/development/csgrs/target/hyperbrep-development/crates/hyperbrep" }
hyperbrep-io = { path = "/mnt/development/csgrs/target/hyperbrep-development/crates/hyperbrep-io" }
hypercurve = { path = "/mnt/development/csgrs/target/hyperbrep-development/crates/hypercurve" }
hyperlimit = { path = "/mnt/development/csgrs/target/hyperbrep-development/crates/hyperlimit" }
serde_json = "1"
