[package]
name = "hyperbrep-prism-receipt-probe"
version = "0.0.0"
edition = "2024"
[workspace]
[dependencies]
hyperbrep = { path = "/mnt/development/csgrs/crates/hyperbrep", default-features = false }
hyperbrep-io = { path = "/mnt/development/csgrs/crates/hyperbrep-io" }
hypercurve = { path = "/mnt/development/csgrs/crates/hypercurve", features = ["triangulation"] }
hyperlimit = { path = "/mnt/development/csgrs/crates/hyperlimit" }
hyperreal = { path = "/mnt/development/csgrs/crates/hyperreal", features = ["serde", "cached-f64-approx"] }
hypertri = { path = "/mnt/development/csgrs/crates/hypertri", default-features = false, features = ["earcut", "cdt"] }
serde_json = "=1.0.151"
